# Tests de commandes de contrôle (Étape 6)
tests:
  - text: "allume le salon"
    expected:
      intent_type: control
      action: turn_on
      area: salon
      device_class: light

  - text: "éteins la lumière du bureau"
    expected:
      intent_type: control
      action: turn_off
      area: bureau
      device_class: light

  - text: "ferme les volets du salon"
    expected:
      intent_type: control
      action: close
      area: salon
      device_class: cover

  - text: "ouvre les volets du bureau"
    expected:
      intent_type: control
      action: open
      area: bureau
      device_class: cover

  - text: "règle la luminosité du salon à 40%"
    expected:
      intent_type: control
      action: set_brightness
      area: salon
      device_class: light
      parameters:
        brightness_pct: "40"

  - text: "mets le chauffage à 21 degrés"
    expected:
      intent_type: control
      action: set_temperature
      device_class: climate
      parameters:
        temperature: "21"

  - text: "éteins toutes les lumières"
    expected:
      intent_type: control
      action: turn_off
      device_class: light
      risk_level: 1

  - text: "arrête les volets"
    expected:
      intent_type: control
      action: stop
      device_class: cover

  - text: "positionne le volet salon à 30%"
    expected:
      intent_type: control
      action: set_position
      area: salon
      device_class: cover
      parameters:
        value: "30"

  - text: "active le cumulus"
    expected:
      intent_type: control
      action: turn_on
      entity_id: switch.cumulus
