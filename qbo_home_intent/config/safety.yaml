# =============================================================================
# safety.yaml — Règles de sécurité et niveaux de risque
# =============================================================================
# UTILISÉ PAR :
#   - validator.py → get_risk(entity_id, domain, action, parameters)
#                    Appelé dans home_intent_node._resolve() après validate_action()
#                    Retourne (risk_level, warning_message) de la 1ère règle qui matche
#
#   - validator.py → confirmation_required(risk_level)
#                    Retourne True si le niveau demande une confirmation vocale
#                    → status=NEEDS_CONFIRMATION + pending_action stocké en session
#                    → spoken_response = warning affiché, attend "oui" ou "non"
#
# ALGORITHME D'ÉVALUATION :
#   Les règles sont évaluées DANS L'ORDRE du fichier.
#   La PREMIÈRE règle dont tous les filtres correspondent est retournée.
#   → Mettre les règles les plus spécifiques EN PREMIER.
#
# FILTRES DISPONIBLES PAR RÈGLE :
#   entity_id  : comparaison exacte sur l'entity_id résolu
#                ("" ou absent = s'applique à tous)
#   domain     : domaine HA (light, cover, climate, switch...)
#   action     : nom de l'action interne (turn_on, close, set_temperature...)
#   condition  : filtre numérique sur un paramètre extrait :
#                  parameter : nom du paramètre (temperature, brightness_pct...)
#                  operator  : ">" ou "<"
#                  value     : seuil numérique (float)
#
# NIVEAUX DE RISQUE :
#   0 = sûr          → exécution directe, aucun avertissement
#   1 = faible        → exécution directe, warning logué mais pas de confirmation
#   2 = moyen         → confirmation vocale obligatoire ("Confirmez-vous ?")
#   3 = élevé         → confirmation vocale + warning verbal prononcé par TTS
# =============================================================================

risk_levels:
  0: {label: safe,   requires_confirmation: false}
  1: {label: low,    requires_confirmation: false}
  2: {label: medium, requires_confirmation: true}
  3: {label: high,   requires_confirmation: true, verbal_warning: true}

rules:
  # --- Ouverture portail : risque moyen (sécurité extérieure) ---
  - id: portail_open
    entity_id: switch.portail
    action: turn_on
    risk_level: 2
    warning: "Je vais ouvrir le portail. Confirmez-vous ?"

  # --- Ouverture porte de garage : risque moyen ---
  - id: garage_open
    entity_id: switch.porte_garage
    action: turn_on
    risk_level: 2
    warning: "Je vais ouvrir la porte du garage. Confirmez-vous ?"

  # --- Coupure chauffe-eau : risque moyen (eau froide, choc thermique) ---
  - id: cumulus_off
    entity_id: switch.cumulus
    action: turn_off
    risk_level: 2
    warning: "Je vais couper le cumulus. Confirmez-vous ?"

  # --- Extinction toutes lumières : risque faible, pas de confirmation ---
  # entity_id vide = s'applique à toute commande turn_off sur le domaine light
  # sans entity_id précis (ex. "éteins toutes les lumières")
  - id: all_lights_off
    entity_id: ""
    domain: light
    action: turn_off
    risk_level: 1
    warning: "Je vais éteindre toutes les lumières."

  # --- Fermeture tous les volets : risque faible, pas de confirmation ---
  - id: all_covers_close
    entity_id: ""
    domain: cover
    action: close
    risk_level: 1
    warning: "Je vais fermer tous les volets."

  # --- Consigne chauffage trop élevée (> 27°C) : risque moyen ---
  # condition évalue le paramètre 'temperature' extrait par slot_extractor
  - id: temperature_high
    domain: climate
    action: set_temperature
    condition:
      parameter: temperature
      operator: ">"
      value: 27.0
    risk_level: 2
    warning: "La consigne demandée est élevée. Confirmez-vous ?"

  # --- Consigne chauffage trop basse (< 7°C) : risque moyen ---
  - id: temperature_low
    domain: climate
    action: set_temperature
    condition:
      parameter: temperature
      operator: "<"
      value: 7.0
    risk_level: 2
    warning: "La consigne est très basse. Confirmez-vous ?"


