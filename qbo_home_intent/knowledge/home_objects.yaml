  #   device_class: temperature
  #   area: bureau
  #   entity_id: sensor.thermometre_bureau_1_1_100
  #   aliases: [thermomètre bureau, sonde bureau, capteur température bureau]
  #   capabilities: [get_state]

  # - id: thermometre_bureau_2
