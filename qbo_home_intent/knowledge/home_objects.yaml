# Base domestique manuelle — ~10 objets pour valider l'architecture (Étape 2)
objects:
  - id: lumiere_bureau
    label: "Lumière bureau"
    device_class: light
    area: bureau
    entity_id: light.bureau
    aliases: [lumiere du bureau, eclairage bureau, bureau lumiere]
    capabilities: [turn_on, turn_off, set_brightness]

  - id: volet_bureau
    label: "Volet bureau"
    device_class: cover
    area: bureau
    entity_id: cover.volet_roulant_sw_bureau
    aliases: [volet du bureau, store bureau, rideau bureau]
    capabilities: [open, close, stop, set_position]

  - id: chauffage_bureau
    label: "Chauffage bureau"
    device_class: select
    area: bureau
    entity_id: select.chauffage_bureau
    aliases: [chauffage du bureau, fil pilote bureau, mode chauffage bureau]
    capabilities: [select_option]

  - id: temperature_bureau
    label: "Température bureau"
    device_class: temperature
    area: bureau
    entity_id: sensor.temperature_moyenne_bureau
    aliases: [température du bureau, temp bureau, chaleur bureau, combien il fait dans le bureau]
    capabilities: [get_state]

  # - id: thermometre_bureau_1
