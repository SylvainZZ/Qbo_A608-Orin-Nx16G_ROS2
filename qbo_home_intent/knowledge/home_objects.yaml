  #   device_class: temperature
  #   area: bureau
  #   entity_id: sensor.thermometre_bureau_1_1_113
  #   aliases: [deuxième thermomètre bureau, sonde bureau 2]
  #   capabilities: [get_state]

  - id: tars_batterie
    label: "Tars batterie"
    device_class: battery
    area: bureau
    entity_id: sensor.bureau_tars_batterie
    aliases: [batterie tars, batterie aspirateur bureau, niveau batterie tars, robot tars]
    capabilities: [get_state]

  - id: energie_chauffage_bureau
    label: "Énergie chauffage bureau"
    device_class: energy
    area: bureau
    entity_id: sensor.compteur_energie_chauffage_bureau
    aliases: [consommation chauffage bureau, énergie fil pilote bureau]
    capabilities: [get_state]

  - id: puissance_chauffage_bureau
    label: "Puissance chauffage bureau"
    device_class: power
    area: bureau
    entity_id: sensor.puissance_instantanee_chauffage_bureau
    aliases: [puissance chauffage bureau, watts chauffage bureau]
    capabilities: [get_state]