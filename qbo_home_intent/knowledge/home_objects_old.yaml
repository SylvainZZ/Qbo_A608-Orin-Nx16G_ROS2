# Base domestique manuelle — ~10 objets pour valider l'architecture (Étape 2)
objects:
  - id: lumiere_salon
    label: "Lumière salon"
    device_class: light
    area: salon
    entity_id: light.salon
    aliases: [lumiere du salon, salon lumiere, eclairage salon, lumiere sejour]
    capabilities: [turn_on, turn_off, set_brightness]

  - id: volet_salon
    label: "Volets salon"
    device_class: cover
    area: salon
    entity_id: cover.volet_roulant_sw_salon
    aliases: [volets du salon, store salon, rideau salon, volet salon]
    capabilities: [open, close, stop, set_position]

  - id: chauffage_jour
    label: "Chauffage zone jour"
    device_class: climate
    area: salon
    entity_id: climate.chauffage_zone_3
    aliases: [chauffage salon, chauffage sejour, thermostat salon, chauffage jour]
    capabilities: [set_temperature]

  - id: temperature_salon
    label: "Température salon"
    device_class: sensor
    area: salon
    entity_id: sensor.thermometre_salon_1_1_82
    aliases: [temperature du salon, il fait combien dans le salon, temperature salon]
    capabilities: [read_temperature]

  - id: portail
    label: "Portail"
    device_class: switch
    area: exterieur
    entity_id: switch.portail
    aliases: [portail, portillon, entree]
    capabilities: [turn_on, turn_off]
    risk_level: 2

  - id: porte_garage
    label: "Porte garage"
    device_class: switch
    area: atelier
    entity_id: switch.porte_garage
    aliases: [porte du garage, garage, porte garage]
    capabilities: [turn_on, turn_off]
    risk_level: 2

  - id: batterie_zendure
    label: "Batterie Zendure"
    device_class: sensor
    area: atelier
    entity_id: sensor.solarflow_1600_ac_plus_electric_level
    aliases: [batterie, batterie solaire, niveau batterie, zendure]
    capabilities: [read_state]

  - id: production_solaire
    label: "Production solaire"
    device_class: sensor
    area: exterieur
    entity_id: sensor.solar_production_power
    aliases: [production solaire, panneaux solaires, energie solaire, solaire]
    capabilities: [read_power]

  - id: eau_pluie
    label: "Eau de pluie"
    device_class: sensor
    area: exterieur
    entity_id: sensor.citerne_eau_pluie
    aliases: [eau de pluie, citerne, cuve, reserve eau]
    capabilities: [read_state]

  - id: lumiere_bureau
    label: "Lumière bureau"
    device_class: light
    area: bureau
    entity_id: light.bureau
    aliases: [lumiere du bureau, eclairage bureau, bureau lumiere]
    capabilities: [turn_on, turn_off, set_brightness]

  - id: volet_bureau
