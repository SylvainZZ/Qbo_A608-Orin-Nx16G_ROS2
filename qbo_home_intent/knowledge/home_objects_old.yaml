    aliases: [chauffage chambre 2, fil pilote chambre 2]
    capabilities: [select_option]

  - id: cumulus
    label: "Cumulus"
    device_class: switch
    area: atelier
    entity_id: switch.cumulus
    aliases: [cumulus, chauffe eau, eau chaude, ballon eau chaude]
    capabilities: [turn_on, turn_off]
    risk_level: 2

  - id: temperature_exterieure
    label: "Température extérieure"
    device_class: sensor
    area: exterieur
