  - id: chauffage_bureau
    label: "Chauffage bureau"
    device_class: select
    area: bureau
    entity_id: select.chauffage_bureau
    aliases: [chauffage du bureau, fil pilote bureau, mode chauffage bureau]
    capabilities: [select_option]

  - id: chauffage_chambre_1
    label: "Chauffage chambre 1"
