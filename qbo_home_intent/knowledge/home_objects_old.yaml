    capabilities: [open, close, stop, set_position]

  - id: lumiere_chambre_1
    label: "Lumière chambre 1"
    device_class: light
    area: chambre_1
    entity_id: light.chambre_1
    aliases: [lumiere chambre 1, eclairage chambre 1, lumiere chambre principale]
